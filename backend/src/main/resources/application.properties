server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spm?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# Cac gia tri nhay cam phai duoc dat bang bien moi truong khi trien khai that
app.jwt.secret=${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-key-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.upload-dir=${UPLOAD_DIR:uploads}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.seed-demo-data=${SEED_DEMO_DATA:true}

# GitHub: khoa ma hoa token luu trong CSDL (dat bang bien moi truong khi trien khai that)
app.github.token-secret=${GITHUB_TOKEN_SECRET:${app.jwt.secret}}
